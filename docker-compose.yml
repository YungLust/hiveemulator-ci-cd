services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]

  communication-control:
    image: ghcr.io/YungLust/communication-control:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    environment:
      - Redis__ConnectionString=redis:6379
    depends_on: [redis]

  hivemind:
    image: ghcr.io/YungLust/hivemind:latest
    restart: on-failure
    ports: ["5149:5149"]
    environment:
      - CommunicationConfiguration__CommunicationControlIP=communication-control
      - CommunicationConfiguration__CommunicationControlPort=8080
    depends_on: [redis, communication-control]

  map-client:
    image: ghcr.io/YungLust/map-client:latest
    restart: unless-stopped
    ports: ["3000:80"]
    depends_on: [communication-control]
